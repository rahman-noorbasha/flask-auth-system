<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Login — Auth System</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<style>
		.card { max-width: 420px; width: 100%; }
	</style>
</head>
<body class="bg-light">
	<main class="min-vh-100 d-flex align-items-center justify-content-center">
		<div class="card shadow-sm">
			<div class="card-body p-4">
				<h3 class="mb-3">Sign in</h3>
				<p class="text-muted mb-4">Enter your credentials to continue.</p>

				{% with messages = get_flashed_messages(with_categories=True) %}
				  {% if messages %}
					{% for category, msg in messages %}
					  <div class="alert {% if category == 'success' %}alert-success{% else %}alert-danger{% endif %} alert-dismissible fade show" role="alert">
						{{ msg }}
						<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
					  </div>
					{% endfor %}
				  {% endif %}
				{% endwith %}

				<form method="POST" novalidate>
					<div class="mb-3">
						<label for="username" class="form-label">Username or Email</label>
						<input id="username" name="username" type="text" class="form-control" placeholder="you@example.com" required autocomplete="username">
					</div>

					<div class="mb-3">
						<label for="password" class="form-label">Password</label>
						<input id="password" name="password" type="password" class="form-control" placeholder="Password" required autocomplete="current-password">
					</div>

					<div class="d-grid">
						<button type="submit" class="btn btn-primary">Sign in</button>
					</div>
				</form>

				<div class="mt-3 text-center">
					<small class="text-muted">Don't have an account? <a href="/register">Register</a></small>
				</div>
			</div>
		</div>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
